<!DOCTYPE html>
<html lang="hu">
  <head>
    <meta charset="utf-8" />
    <title>Fix Your Back — UI terv</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages — a react-router BrowserRouter
      // mély linkjeit (pl. /gyt/naptar) GitHub Pages nem tudja szerverként
      // kiszolgálni (nincs igazi útvonal-átírás), ezért ide fut be minden
      // 404, ami visszairányítja a kérést a valódi index.html-re, a
      // célútvonalat egy query-stringbe kódolva (ld. index.html dekódolása).
      // https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1
      var l = window.location
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      )
    </script>
  </head>
  <body></body>
</html>
